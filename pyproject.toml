[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graspo"
dynamic = ["version"]
description = "GRASPO (Group Relative Adaptive Structured Policy Optimization) — LoRA reinforcement learning with a self-owned native TP/PP backend."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{ name = "Godthrone" }]
dependencies = [
  # torch/torchvision 精确锁定以匹配 Docker base 镜像（pytorch/pytorch digest）
  # 预装的 CUDA 13.2 运行时；升级须同步 docker/Dockerfile 的 base digest。
  "torch==2.12.1",
  "torchvision==0.27.1",
  # 其余依赖全部精确锁定：pyproject 是版本唯一声明处，uv.lock 与镜像一致。
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "safetensors==0.7.0",
  "transformers==5.10.2",
  "pillow==12.2.0",
  "numpy==2.4.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.13",
  "mypy==2.1.0",
]

[project.scripts]
graspo = "graspo.cli.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
# Version from git tags. v0.10.2 → "0.10.2", dirty tree → "0.10.3.dev0+d20250714"
# Docker builds set SETUPTOOLS_SCM_PRETEND_VERSION to avoid shallow-clone issues.
tag_regex = "^(?:v)?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# HTML 生成脚本：拼接长行是固有风格，跳过行长与变量名检查
"tests/data/generate_annotation_viewer.py" = ["E501", "E741"]
# 数据集生成脚本：completion/annotation 数据行固有超长，跳过行长检查
"scripts/generate_v2_testset.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# 类改目录的 mixin 模块豁免（结构性类型盲区）：
# mixin 方法引用兄弟 mixin/主类属性（self._print_json 等），mypy 按单类
# 视角无法验证组合后的完整类；组合正确性由测试覆盖（豁免文件内的模块级
# 纯函数已提取到 helpers.py，恢复 mypy 检查）。
# 约束：tests/core/test_mypy_exemptions.py 保证豁免列表只覆盖 mixin 文件。
[[tool.mypy.overrides]]
module = [
    "graspo.flow.adapters.models.qwen35_36.training",
    "graspo.flow.adapters.models.qwen35_36.training_sft",
    "graspo.flow.adapters.models.qwen35_36.generation",
    "graspo.flow.adapters.models.qwen35_36.logprobs",
    "graspo.flow.adapters.models.qwen35_36.pipeline_forward",
    "graspo.flow.trainer.rollout",
    "graspo.flow.trainer.optimize",
    "graspo.flow.trainer.checkpoint",
]
ignore_errors = true

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
