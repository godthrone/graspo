[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graspo"
dynamic = ["version"]
description = "GRASPO (Group Relative Advantage Structured Policy Optimization) — GRPO-style RL and SFT for structured LLM outputs. Token-level reward via character annotation. 9B on a single 80GB GPU. GraspoFlow unifies TP+DP+PP+SP+Checkpoint five-dimensional parallelism. Group filtering, perfect-skip, multimodal, tool-call reward."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{ name = "Godthrone" }]
dependencies = [
  # torch/transformers 精确锁定以匹配**实测在用的执行载体**（目标 GPU 服务器的镜像
  # graspo-msswift:4.5.3，ms-swift 4.5.3 在其中跑通）——以镜像实测版本为准，
  # 声明版本必须等于镜像内版本（门禁 scripts/check_env_versions.py）。
  # 【实测确证】实测血统：torch 2.11.0+cu130、transformers 5.12.1、pydantic 2.11.10、
  # python 3.12.13。两个镜像配方都用**公开 base** + 官方 cu130 轮子索引取到该血统
  # （内网镜像信息属环境信息，只记录在 `.local/`，不入 tracked 文件，见 §15.1/§16）。
  "torch==2.11.0",
  # torchvision 与 torch 2.11.0 配对【待上机实测确认】：0.27.x 要求 torch 2.12.x，
  # 改 torch 后必须同步下调；门禁会逐包比对，容器内一次确认。
  "torchvision==0.26.0",
  # 其余依赖全部精确锁定：pyproject 是版本唯一声明处，uv.lock 与镜像一致。
  # pydantic 也以镜像实测为准（2.11.10）——门禁包集合自动派生自本文件全部
  # `==` pin，不再手工列举（旧版门禁手工列表漏了 pydantic，见 §2 防呆）。
  "pydantic==2.11.10",
  "pyyaml==6.0.3",
  "safetensors==0.7.0",
  "transformers==5.12.1",
  "pillow==12.2.0",
  "numpy==2.4.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.13",
  "mypy==2.1.0",
]
# ms-swift 后端依赖。**必须精确锁定**（宪法 §6 环境可复现）：区间约束
# `>=4.2,<5.0` 会让实测环境里的实际版本漂移。锁定值 = 实测在用的版本：
# `swift.__version__ == 4.5.3`，且 ms-swift 自产 args.json 记录
# "swift_version": "4.5.3"。ms-swift 在 `uv.lock` 中已随 msswift extra 解析；
# 镜像配方另用 pip `ms-swift==4.5.3` 精确安装——两处声明由
# `scripts/check_env_versions.py` 逐包比对，不得分叉。
msswift = ["ms-swift==4.5.3"]

[project.scripts]
graspo = "graspo.cli.app:main"

[project.entry-points."graspo.rewards"]
graspo = "graspo.ripple.reward.reward:GraspoReward"

[project.entry-points."graspo.adapters"]
qwen3 = "graspo.flow.adapters.models.qwen3.adapter:Qwen3Adapter"
qwen35_36 = "graspo.flow.adapters.models.qwen35_36.adapter:Qwen35Adapter"

[project.entry-points."graspo.backends"]
native = "graspo.flow.backend_selection:create_native_trainer"
msswift = "graspo.flow.msswift.trainer:create_msswift_trainer"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
# Version from git tags. v0.10.2 → "0.10.2", dirty tree → "0.10.3.dev0+d20250714"
# Docker builds set SETUPTOOLS_SCM_PRETEND_VERSION to avoid shallow-clone issues.
tag_regex = "^(?:v)?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# 类改目录的 mixin 模块豁免（结构性类型盲区）：
# mixin 方法引用兄弟 mixin/主类属性（self._print_json 等），mypy 按单类
# 视角无法验证组合后的完整类；组合正确性由测试覆盖（豁免文件内的模块级
# 纯函数已提取到 helpers.py，恢复 mypy 检查）。
# 约束：tests/core/test_mypy_exemptions.py 保证豁免列表只覆盖 mixin 文件。
[[tool.mypy.overrides]]
module = [
    "graspo.flow.adapters.models.qwen35_36.training",
    "graspo.flow.adapters.models.qwen35_36.training_sft",
    "graspo.flow.adapters.models.qwen35_36.generation",
    "graspo.flow.adapters.models.qwen35_36.logprobs",
    "graspo.flow.adapters.models.qwen35_36.pipeline_forward",
    "graspo.flow.trainer.rollout",
    "graspo.flow.trainer.optimize",
    "graspo.flow.trainer.checkpoint",
]
ignore_errors = true

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
