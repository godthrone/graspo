# E2E smoke test config — minimal params for fast matrix verification
train_method: graspo
backend: graspoflow

model:
  model_path: /data/zhangzy/models/Qwen3.5-9B
  trust_remote_code: true
  torch_dtype: bfloat16
  gradient_checkpointing: true
  chat_template_kwargs:
    enable_thinking: false

data:
  train_path: samples/data/sample_tool_call.jsonl
  max_prompt_length: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  adapter_path: null
  target_preset: language_safe

graspoflow:
  tp_size: 4
  dp_size: 1
  pp_size: 1
  micro_batch_size: 1
  dp_replicate_lora: true
  placement_strategy: qwen3_tp
  sequence_parallel: true

training:
  output_dir: ""
  run_name: 9b_tp4sp
  seed: 42
  max_epochs: 1
  rollout_group_size: 2
  rollout_queue_batch_size: 2
  gradient_accumulation_micro_batches: 1
  rollout_max_retries: 2
  learning_rate: 5.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  policy_ratio_clip_eps: 0.2
  max_new_tokens: 64
  temperature: 1.0
  top_p: 1.0
  save_steps: -1
  save_checkpoint_every_epoch: false
  perfect_skip_reward_threshold: 2.0
  reject_unparseable_groups: false
  lr_scheduler:
    type: constant
    warmup_steps: 0
    min_lr_ratio: 0.0
    decay_steps: 0

launch:

reward:
  kind: graspo
  check_think: false
  check_json_markdown: true
  check_list_order: false
  marker_reward_weight: 10.0
  content_reward_weight: 100.0
  anti_useless_str_reward_weight: 1.0
  anti_useless_str_half_reward_len: 100
  numeric_tolerance: 0.2