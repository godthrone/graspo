# 本文件由 tools/matrix/gen_configs.py 从 docs/capability-matrix.data.json 自动生成，⛔ 禁止手工编辑；请改数据后重新生成。
train_method: graspo
backend: native
tuner_type: lora
model:
  model_path: /models/Qwen3.5-9B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets-v2/T030.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/T030
  run_name: T030
  overwrite_output_dir: true
  seed: 42
  max_epochs: 8
  learning_rate: 1.0e-05
  gradient_accumulation_micro_batches: 1
  save_checkpoint_every_epoch: false
  save_steps: 49
export:
  final_formats: ["merged-hf"]
launch:
  nproc_per_node: 4   # ★ 由 cards=4 推导（§12 同源：卡数与进程数不得各改一半）
reward:
  kind: graspo
lora:
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - language_all_linear
    - vision_common
native:
  tp_size: 1
  dp_size: 4
  pp_size: 1
  micro_batch_size: 1
gpu_monitor:
  output_dir: /out/gpu
  tag: T030
  interval_sec: 2.0
