# 本文件由 tools/matrix/gen_configs.py 从 docs/capability-matrix.data.json 自动生成，⛔ 禁止手工编辑；请改数据后重新生成。
train_method: cpt
backend: msswift
tuner_type: full
model:
  model_path: /models/Qwen3.5-9B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets-v2/T004.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/T004
  run_name: T004
  overwrite_output_dir: true
  seed: 42
  max_epochs: 2
  learning_rate: 5e-06
  gradient_accumulation_micro_batches: 1
  save_checkpoint_every_epoch: false
  save_steps: 201
launch:
  cards: 1
  nproc_per_node: 1   # ★ 由 cards 推导（同一真源；⛔ 不得只改一半）
msswift:
  nproc_per_node: 1
  nnodes: 1
  per_device_train_batch_size: 1
  sequence_parallel_size: 1
  use_vllm: false
  deepspeed: zero2_offload
gpu_monitor:
  output_dir: /out/gpu
  tag: T004
  interval_sec: 2.0
