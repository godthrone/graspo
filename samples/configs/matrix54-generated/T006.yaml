# 本文件由 tools/matrix/gen_configs.py 从 docs/capability-matrix.data.json 自动生成，⛔ 禁止手工编辑；请改数据后重新生成。
train_method: cpt
backend: msswift
tuner_type: full
model:
  model_path: /models/Qwen3.5-9B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets-v2/T006.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/T006
  run_name: T006
  overwrite_output_dir: true
  seed: 42
  max_epochs: 2
  learning_rate: 5e-06
  gradient_accumulation_micro_batches: 1
  save_checkpoint_every_epoch: false
  save_steps: 51
launch:
  nproc_per_node: 4   # ★ 由 cards=4 推导（§12 同源：卡数与进程数不得各改一半）
msswift:
  nproc_per_node: 4
  nnodes: 1
  per_device_train_batch_size: 1
  sequence_parallel_size: 1
  use_vllm: false
  deepspeed: zero2
gpu_monitor:
  output_dir: /out/gpu
  tag: T006
  interval_sec: 2.0
