train_method: graspo
backend: msswift
tuner_type: lora
model:
  model_path: /models/Qwen3.5-9B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets-v2/T032.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/T032
  run_name: T032
  overwrite_output_dir: true
  seed: 42
  max_epochs: 5
