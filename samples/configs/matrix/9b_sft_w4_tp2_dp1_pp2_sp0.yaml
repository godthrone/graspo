# GRASPO e2e matrix [SFT]: 9B w=4 TP=2 DP=1 PP=2 SP=off
train_method: sft
backend: native
model:
  model_path: /data/user/models/Qwen3.5-9B
  trust_remote_code: true
  torch_dtype: bfloat16
  gradient_checkpointing: true
  chat_template_kwargs:
    enable_thinking: false
data:
  train_path: samples/data/tool_call_mm/train.jsonl
  max_prompt_length: 8192
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  adapter_path: null
  target_preset: language_safe
  target_modules:
      - language_all_linear
      - vision_common
native:
  tp_size: 2
  dp_size: 1
  pp_size: 2
  micro_batch_size: 1
  dp_replicate_lora: true
training:
  output_dir: /workspace/outputs
  run_name: 9b_sft_w4_tp2_dp1_pp2_sp0
  seed: 42
  max_epochs: 1
  gradient_accumulation_micro_batches: 1
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_steps: -1
  save_checkpoint_every_epoch: false
  lr_scheduler:
    type: constant
    warmup_steps: 0
    min_lr_ratio: 0.0
    decay_steps: 0
  learning_rate: 5e-05
launch: null
