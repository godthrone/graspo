# ★ 量测专用派生档（⛔ 非 canonical；canonical = samples/configs/matrix54-generated/T016.yaml）
# 用途：T016（9B SFT 全参 native）1 卡实测 OOM ⇒ 2 卡复测「是否越过训练阶段第 1 步」
# ★ 同源性要求：**卡数与训练进程数必须一致** —— 本档 native.dp_size=2 ⇒ 起跑侧须 cards=2 且 nproc_per_node=2
#   （事故背景：set_cards.py 曾只改 gpus、未同步 nproc ⇒ dry-run 出 `gpus=1,7 nproc=1` ⇒ 量测口径不成立）
# 生成方式：由 canonical T016.yaml 派生，仅改 native.dp_size（1→2）；其余字段逐字不变。
# 本文件由 tools/matrix/gen_configs.py 从 docs/capability-matrix.data.json 自动生成，⛔ 禁止手工编辑；请改数据后重新生成。
train_method: sft
backend: native
tuner_type: full
model:
  model_path: /models/Qwen3.5-9B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets-v2/T016.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/T016
  run_name: T016
  overwrite_output_dir: true
  seed: 42
  max_epochs: 2
  learning_rate: 5e-05
  gradient_accumulation_micro_batches: 1
  save_checkpoint_every_epoch: false
  save_steps: 201
native:
  tp_size: 1
  dp_size: 2
  pp_size: 1
  micro_batch_size: 1
gpu_monitor:
  output_dir: /out/gpu
  tag: T016
  interval_sec: 2.0
