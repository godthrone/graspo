# 本文件由 tools/matrix/gen_configs.py 从 docs/capability-matrix.data.json 自动生成，⛔ 禁止手工编辑；请改数据后重新生成。
train_method: opd
backend: msswift
tuner_type: lora
model:
  model_path: /models/Qwen3.8-27B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets-v2/M067.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/M067
  run_name: M067
  overwrite_output_dir: true
  seed: 42
  max_epochs: 2
  learning_rate: 2.0e-05
  gradient_accumulation_micro_batches: 1
  save_checkpoint_every_epoch: false
  save_steps: 101
launch:
  nproc_per_node: 2   # ★ 由 cards=2 推导（§12 同源：卡数与进程数不得各改一半）
distill:
  # ★ 外部教师服务：教师 = Qwen3.8-27B 的 SFT/LoRA/dp1 产物，vLLM 另卡部署 ⇒ 教师占卡**不计入本档 cards**（矩阵卡数只算被训练的模型）
  # ★ 本地教师不加载 ⇒ 不写 teacher_model_path / offload_teacher_model；端点由起服脚本 tools/matrix/serve_teacher.sh 注入/对齐
  teacher_model_server: http://127.0.0.1:18901
  # ★ 外部服务只回 top-k logprobs ⇒ 上游强制非空（起服侧 --max-logprobs >= topk+1）
  gkd_logits_topk: 64
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: '^(?:model\.)?language_model\..*\.(q_proj|k_proj|v_proj|o_proj|in_proj_z|out_proj|in_proj_qkv|gate_proj|up_proj|down_proj)$|^(?:model\.)?visual\.(blocks\.\d+\.(attn\.(qkv|proj)|mlp\.linear_fc1|mlp\.linear_fc2)|merger\.linear_fc1|merger\.linear_fc2)$'
msswift:
  nproc_per_node: 2
  nnodes: 1
  per_device_train_batch_size: 1
  sequence_parallel_size: 1
  use_vllm: false
gpu_monitor:
  output_dir: /out/gpu
  tag: M067
  interval_sec: 2.0
