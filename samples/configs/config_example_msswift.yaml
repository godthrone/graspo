# GRASPO ms-swift 后端配置模板（config_example_msswift.yaml）
#
# 本模板覆盖使用 ms-swift 后端时的全部字段。复制后改几处即可用。
# 注意：`extra="forbid"`，请勿添加未列出的字段；所有影响产物的参数必须在这里，
# 不要用环境变量/CLI 覆盖（宪法 §7.1 / §10.1）。
#
# 启动：uv run graspo launch --config config_example_msswift.yaml
#
# ⚠️ ms-swift 后端需要额外安装：pip install graspo[msswift]

# ── 训练方法与后端 ────────────────────────────────────────────────────────────
train_method: graspo          # graspo=RL | sft=SFT
backend: msswift              # ms-swift 后端：委托给 ms-swift 生态（vLLM + DeepSpeed/FSDP）
                              # 注意：msswift 后端不使用 native 配置段（无 tp_size/dp_size/pp_size）
                              # 分布式并行由 ms-swift 的 DeepSpeed/Megatron/FSDP 配置控制

# ── 模型 ─────────────────────────────────────────────────────────────────────
model:
  model_path: models/Qwen3.5-9B
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: null      # null=默认；可选 "flash_attention_2" 等
  gradient_checkpointing: true   # 用计算换显存（正交，不影响并行）
  chat_template_kwargs:
    enable_thinking: false

# ── 数据 ─────────────────────────────────────────────────────────────────────
data:
  train_path: samples/data/json_output/train.jsonl
  max_prompt_length: 4096

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  adapter_path: null             # null=从头训练；否则指向已导出 LoRA
  target_preset: language_safe
  target_modules: null           # null=用 target_preset 推断
  bias: none
  task_type: CAUSAL_LM

# ── 训练超参 ────────────────────────────────────────────────────────────────
training:
  output_dir: ""                 # 空=自动生成 outputs/<run_name>_<timestamp>
  run_name: ""
  seed: 42
  max_epochs: 20
  rollout_group_size: 8
  rollout_queue_batch_size: 8
  gradient_accumulation_micro_batches: 4
  rollout_max_retries: 5
  learning_rate: 5.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  policy_ratio_clip_eps: 0.2
  max_new_tokens: 2048
  temperature: 1.0
  top_p: 1.0
  save_steps: -1                 # -1=禁用阶段性保存
  save_checkpoint_every_epoch: true
  save_checkpoint_time_period_minutes: 0  # 0=关闭；>0=每 N 分钟墙钟保存 checkpoint
  perfect_skip_reward_threshold: 1.0
  reject_unparseable_groups: true
  resume_from_checkpoint: null
  lr_scheduler:
    type: constant               # constant | cosine | linear
    warmup_steps: 0
    min_lr_ratio: 0.0
    decay_steps: 0               # type!=constant 时必填 >0
  lr_scaling: linear             # 梯度累积跨 DP 的 LR 缩放策略

# ── 导出（graspo export 用）───────────────────────────────────────────────
export:
  checkpoint_path: ""
  export_format: peft-adapter
  export_output: ""
  final_formats: []

# ── 启动（单节点）───────────────────────────────────────────────────────────
launch:
  nproc_per_node: null           # 空=从 dp_size×tp_size×pp_size 自动推导
  nnodes: 1
  node_rank: 0
  master_addr: 127.0.0.1
  master_port: 29500
  python: null

# ── Reward（graspo/RL 用；SFT 忽略，为转 RL 预留）─────────────────────────
reward:
  kind: graspo
  check_think: false
  check_json_markdown: true
  check_list_order: false
  marker_reward_weight: 10.0
  content_reward_weight: 100.0
  anti_useless_str_reward_weight: 1.0
  anti_useless_str_half_reward_len: 100
  numeric_tolerance: 0.2

# ══════════════════════════════════════════════════════════════════════════════
# ms-swift 后端说明
# ══════════════════════════════════════════════════════════════════════════════
#
# 1. 安装 ms-swift 依赖：
#    pip install graspo[msswift]
#
# 2. 与 native 后端的主要区别：
#    - 无 native 配置段（不需要 tp_size/dp_size/pp_size）
#    - 分布式并行由 ms-swift 的 DeepSpeed/Megatron/FSDP 自动管理
#    - Rollout 使用 vLLM 引擎（300% 加速）
#    - 支持 600+ 模型（vs native 的 Qwen3.5/3.6 系列）
#    - 支持 7 种量化方法、11 种 LoRA 变体、150+ 内置数据集
#    - 支持推理部署（swift deploy）+ 评测（EvalScope）
#
# 3. 两种后端共享：
#    - ripple 算法层（字符级标注、token 级 advantage、GRASPORippleLoss）
#    - 训练数据格式（JSONL：messages + targets + tools）
#    - CLI 入口（graspo launch --config ...）
#    - 配置校验（pydantic，extra="forbid"）
#
# 4. 切换回 native 后端：只需将 backend 改为 "native"，并添加 native 配置段。
#    参见 samples/configs/config_example.yaml。