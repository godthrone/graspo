# GRASPO ms-swift 后端配置模板（config_example_msswift.yaml）
#
# 本模板覆盖使用 ms-swift 后端时的全部字段。复制后改几处即可用。
# 注意：`extra="forbid"`，请勿添加未列出的字段；所有影响产物的参数必须在这里，
# 不要用环境变量/CLI 覆盖（宪法 §7.1 / §10.1）。
#
# 启动：uv run graspo launch --config config_example_msswift.yaml
#
# ⚠️ ms-swift 后端需要额外安装：pip install graspo[msswift]

# ── 训练方法与后端 ────────────────────────────────────────────────────────────
train_method: graspo          # graspo=RL | sft=SFT
backend: msswift              # ms-swift 后端：委托给 ms-swift 生态（vLLM + DeepSpeed/FSDP）
                              # 注意：msswift 后端不使用 native 配置段（无 tp_size/dp_size/pp_size）
                              # 分布式并行由 ms-swift 的 DeepSpeed/Megatron/FSDP 配置控制

# ── ms-swift 后端参数（`backend: msswift` 的唯一参数来源）─────────────────────
#
# 字段名与 ms-swift 官方参数名逐字对应（去掉前导 `--`），`extra="forbid"` 校验。
# `null` / 缺省 = 未提供 → 不透传给 ms-swift（由 ms-swift 默认值决定）；
# 它与"显式 0/False"语义不同，不要用 0/"" 表达"不设置"。
#
# 分片/并行类型（对应方案 §8 矩阵）：
#   S1 数据并行 DDP        : nproc_per_node / nnodes / node_rank / master_addr / master_port
#   S2 device_map 模型并行 : device_map
#   S3 DeepSpeed ZeRO-0/1/2/3(+offload) : deepspeed（zero0..zero3 / zero2_offload / zero3_offload）
#   S4 ZeRO++              : zero_hpz_partition_size
#   S5 DeepSpeed AutoTP    : deepspeed_autotp_size（仅 zero0/1/2 + 仅全参）
#   S6 FSDP2               : fsdp（fsdp2；与 DeepSpeed 互斥）
#   微批                   : per_device_train_batch_size
#   S7 序列并行 SP         : sequence_parallel_size（Ulysses + Ring 共用；默认 1 = 关闭）
#   长文附项               : rope_scaling / max_model_len / packing / padding_free / attn_impl / use_liger_kernel / use_logits_to_keep
#   Megatron 路径（MG1-MG11）: megatron.* —— 仅透传 + 启动冒烟，不做长训验证
#
# 例（9B LoRA + SP2 + ZeRO3 + 32K 长文）：
#   msswift:
#     sequence_parallel_size: 2
#     deepspeed: zero3
#     rope_scaling: dynamic
#     max_model_len: 32768
#     packing: true
#     attn_impl: flash_attn
#     nproc_per_node: 2
msswift:
  sequence_parallel_size: 1        # S7 序列并行（1 = 关闭）
  deepspeed: null                  # S3 例：zero3 / zero2_offload ...
  fsdp: null                       # S6 例：fsdp2（与 deepspeed 互斥）
  device_map: null                 # S2 例：auto（轻量层切分）
  zero_hpz_partition_size: null    # S4
  deepspeed_autotp_size: null      # S5
  rope_scaling: null               # 长文：dynamic | yarn
  max_model_len: null
  packing: false
  padding_free: false
  attn_impl: null                  # 非 null 时覆盖 model.attn_implementation
  use_liger_kernel: false
  use_logits_to_keep: false        # 只对需要的位置算 logits（长文 128K 的显存关键开关）
  num_iterations: null            # 每个 rollout batch 的优化轮次（null = graspo 默认 1）
  per_device_train_batch_size: null   # ms-swift --per_device_train_batch_size
  nproc_per_node: null             # S1（null = 单进程）
  nnodes: null
  node_rank: null
  master_addr: null
  master_port: null
  use_vllm: null                   # RL 采样通道：colocate vLLM rollout（true/false/null）
  vllm_mode: null                  # colocate | server
  megatron: {}                     # MG1-MG11；例：{tensor_model_parallel_size: 2, sequence_parallel: true}

# ── 模型 ─────────────────────────────────────────────────────────────────────
model:
  model_path: models/Qwen3.5-9B
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: null      # null=默认；可选 "flash_attention_2" 等
  gradient_checkpointing: true   # 用计算换显存（正交，不影响并行）
  chat_template_kwargs:
    enable_thinking: false

# ── 数据 ─────────────────────────────────────────────────────────────────────
data:
  train_path: samples/data/json_output/train.jsonl
  max_prompt_length: 4096

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  adapter_path: null             # null=从头训练；否则指向已导出 LoRA
  target_preset: language_safe
  target_modules: null           # null=用 target_preset 推断
  bias: none
  task_type: CAUSAL_LM

# ── 训练超参 ────────────────────────────────────────────────────────────────
training:
  output_dir: ""                 # 空=自动生成 outputs/<run_name>_<timestamp>
  run_name: ""
  overwrite_output_dir: false    # 预授权退路（§3.3）：true 才允许覆盖已有输出目录
  seed: 42
  max_epochs: 20
  rollout_group_size: 8
  rollout_queue_batch_size: 8
  gradient_accumulation_micro_batches: 4
  rollout_max_retries: 5
  learning_rate: 5.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  policy_ratio_clip_eps: 0.2
  max_new_tokens: 2048
  temperature: 1.0
  top_p: 1.0
  save_steps: -1                 # -1=禁用阶段性保存
  save_checkpoint_every_epoch: true
  save_checkpoint_time_period_minutes: 0  # 0=关闭；>0=每 N 分钟墙钟保存 checkpoint
  perfect_skip_reward_threshold: 1.0
  reject_unparseable_groups: true
  resume_from_checkpoint: null
  lr_scheduler:
    type: constant               # constant | cosine | linear
    warmup_steps: 0
    min_lr_ratio: 0.0
    decay_steps: 0               # type!=constant 时必填 >0
  lr_scaling: linear             # 梯度累积跨 DP 的 LR 缩放策略

# ── 导出（graspo export 用）───────────────────────────────────────────────
export:
  checkpoint_path: ""
  export_format: peft-adapter
  export_output: ""
  final_formats: []

# ── 启动（单节点）───────────────────────────────────────────────────────────
launch:
  nproc_per_node: null           # 空=从 dp_size×tp_size×pp_size 自动推导
  nnodes: 1
  node_rank: 0
  master_addr: 127.0.0.1
  master_port: 29500
  python: null

# ── Reward（graspo/RL 用；SFT 忽略，为转 RL 预留）─────────────────────────
reward:
  kind: graspo
  check_think: false
  check_json_markdown: true
  check_list_order: false
  marker_reward_weight: 10.0
  content_reward_weight: 100.0
  anti_useless_str_reward_weight: 1.0
  anti_useless_str_half_reward_len: 100
  numeric_tolerance: 0.2

# ══════════════════════════════════════════════════════════════════════════════
# ms-swift 后端说明
# ══════════════════════════════════════════════════════════════════════════════
#
# 1. 安装 ms-swift 依赖：
#    pip install graspo[msswift]
#
# 2. 与 native 后端的主要区别：
#    - 无 native 配置段（不需要 tp_size/dp_size/pp_size）
#    - 分布式并行由上面的 msswift 段配置（DeepSpeed/FSDP/Megatron/SP）
#    - Rollout 使用 vLLM 引擎（300% 加速）
#    - 支持 600+ 模型（vs native 的 Qwen3.5/3.6 系列）
#    - 支持 7 种量化方法、11 种 LoRA 变体、150+ 内置数据集
#    - 支持推理部署（swift deploy）+ 评测（EvalScope）
#
# 3. 两种后端共享：
#    - ripple 算法层（字符级标注、token 级 advantage、GRASPORippleLoss）
#    - 训练数据格式（JSONL：messages + targets + tools）
#    - CLI 入口（graspo launch --config ...）
#    - 配置校验（pydantic，extra="forbid"）
#
# 4. 切换回 native 后端：只需将 backend 改为 "native"，并添加 native 配置段。
#    参见 samples/configs/config_example.yaml。