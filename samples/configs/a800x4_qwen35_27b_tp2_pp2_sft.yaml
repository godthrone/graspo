# GRASPO SFT — 4×A800 Qwen3.5-27B TP=2 + PP=2（张量+管线并行）
#
# 硬件：4× NVIDIA A800 80GB（GPU 0-3）
# 模型：Qwen3.5-27B，多模态
# 拓扑：4 卡时 TP=2 沿 attention head 分片 + PP=2 沿层切分。
#   注意 rank 布局：tp=2, pp=2, dp=1 → world=4，PP 组内 stage 通信在 rank0<->rank2、
#   rank1<->rank3（跨 PCIe pair）。A800 需 `NCCL_P2P_DISABLE=1`（run.sh 已内置）。
# 实测（v0.27.6）：TP+PP=2 smoke exit 0（`optimized: True`，GPipe 实测 44.80s；
#  1F1B 为 PP 唯一调度，PP=4 同级 1F1B 冒烟 38.50s 已验证）。

train_method: sft
backend: graspoflow

model:
  model_path: models/Qwen3.5-27B
  trust_remote_code: true
  torch_dtype: bfloat16
  gradient_checkpointing: true
  chat_template_kwargs:
    enable_thinking: false

data:
  train_path: data/train.jsonl
  max_prompt_length: 8192

lora:
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: [language_all_linear, vision_common]

graspoflow:
  tp_size: 2
  dp_size: 1
  pp_size: 2
  pp_micro_batch_size: 1
  pp_scheduler: one_f_one_b      # 默认（PP 唯一调度）
  pp_max_inflight_microbatches: 0   # 0=auto
  micro_batch_size: 1
  placement_strategy: auto
  sequence_parallel: false
  dp_replicate_lora: true

training:
  output_dir: ""
  run_name: tp2-pp2-sft
  seed: 43
  max_epochs: 20
  gradient_accumulation_micro_batches: 4
  learning_rate: 1.0e-5
  lr_scaling: linear
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_checkpoint_every_epoch: true
  lr_scheduler:
    type: cosine
    warmup_steps: 50
    min_lr_ratio: 0.1
    decay_steps: 13600

launch:
  nproc_per_node: 4

reward:
  kind: graspo
  numeric_tolerance: 0.2
