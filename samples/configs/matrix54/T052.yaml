# T052 | 27B | OPD | LoRA | ms-swift | 1卡
# 生成器: tests/e2e/generate_matrix.py（手改无效，请改生成器）
# 口径: 只用 1/2/4 卡；GPU 集合取自 {0,1,2,3}；上下文长度由递增加长法实测得出，不预设档位。
# 数据: ELAM V5 训练子集前 20 条（宿主数据根目录经 GRASPO_ELAM_HOST_ROOT 注入，见 .local/）；子集由 run_matrix54.sh 生成，图像经 ../images 解析。
# ⚠️ 数据口径告警: ELAM V5 train/test 样本 id 不重叠；但**图像去重交集 752 张**（占测试图像 38.5%），且 **169/702 个测试样本的图像集是某训练样本的子集**。训练集与评测集「同源不重叠」的口径在图像层面不成立，评测结论须在对齐该口径后再下判断。
# 可表达性: ready
# 显存可行性: [unmeasured] ★ **待上机测量（P-25）**：OPD 的教师模型（Qwen3.8-27B）在训练进程内**额外占一份显存**（每个 rank 一份），本生成器**没有**教师侧的实测数字 ⇒ **不得**判定为「可行」。配方已显式设 `distill.offload_teacher_model: true`（教师权重常驻 CPU、前向时换入），但教师**前向时的 GPU 工作集**仍是未测算量 ⇒ 本档标 `unmeasured`，由**上机冒烟**（建议先跑 `T046`）回填实测后再改判定。参考算式（教师**不**换出时）：27B bf16 权重 ≈ 50.3 GiB/卡，与学生侧常驻相加在任何卡数下都超预算 ⇒ 「不换出」不构成可用配方（这是权重常驻的算术事实，不是实测结论）。；学生侧算式：估算每卡 62.3 GiB（预算 78 GiB）⇒ 可行：LoRA：基座冻结 ⇒ 权重 2 B/param；激活/其他预算 12 GiB
# 算法口径: CPT/OPD 的**配置通道**已由 WP-X3 落地（train_method 枚举 + 专用注册表 + ms-swift pretrain/GKD 映射）。因此本档**可表达**。注意两种口径不要混：**「可表达」= 配置能被接受、能生成、能启动**；**「跑通」= 真机跑出 A1–A6 证据**。本档当前只到前者。 算法路径：GKD（`--rlhf_type gkd`）+ 独立冻结教师。**★ 教师侧显存未测算（P-25）**：教师模型在训练进程内**额外占一份显存**，本生成器没有教师侧的实测数字 ⇒ 所有 OPD 档的可行性判定为**「待上机测量」（unmeasured）**，**不得**预先写成「可行」。 ★ 教师/学生关系: **self-distillation** —— 本档**教师 = 学生**（均为 Qwen3.8-27B），**这不是笔误**：台账该档的 `model` 列 = **学生**（graspo 处处如此），而教师是用户拍板的**常量** Qwen3.8-27B，两者同名即自蒸馏（ms-swift 明确支持的合法跑法：LoRA 用 `disable_adapter()` 取教师 logits，不额外加载模型）。逐档关系见 manifest 的 `feasibility_model.opd_teacher.relation_by_tier`（逐档字段名 `opd_teacher_relation`）。
train_method: opd
backend: msswift
tuner_type: lora
model:
  model_path: /models/Qwen3.8-27B
  torch_dtype: bfloat16
  gradient_checkpointing: true
data:
  train_path: /work/elam-v5/subsets/T052.jsonl
  max_prompt_length: 8192
training:
  output_dir: /out/T052
  run_name: T052
  overwrite_output_dir: true
  seed: 42
  max_epochs: 1
  learning_rate: 5e-06
  gradient_accumulation_micro_batches: 1
  save_checkpoint_every_epoch: false
  save_steps: 1
lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_preset: language_safe
msswift:
  nproc_per_node: 1
  per_device_train_batch_size: 1
  sequence_parallel_size: 1
  use_vllm: false
distill:
  teacher_model_path: /models/Qwen3.8-27B
  offload_teacher_model: true
