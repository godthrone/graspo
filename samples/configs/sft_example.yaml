# GRASPO SFT — 最保守单卡配置
#
# 适用：单 GPU（≥24GB 显存），9B 以下模型，纯文本或多模态。
# 启动：uv run graspo launch --config samples/configs/sft_example.yaml
#
# SFT 完成后转 RL：
#   1. train_method 改为 graspo
#   2. lora.adapter_path 指向 SFT checkpoint
#   3. 调整 learning_rate 和 reward 设置

train_method: sft
backend: graspoflow

# ── 模型 ──────────────────────────────────────────────────────────────────
model:
  model_path: models/Qwen3.5-9B        # HuggingFace 模型目录
  trust_remote_code: true
  torch_dtype: bfloat16
  gradient_checkpointing: true         # 用计算换显存
  chat_template_kwargs:
    enable_thinking: false

# ── 数据 ──────────────────────────────────────────────────────────────────
data:
  train_path: samples/data/json_output/train.jsonl
  max_prompt_length: 4096

# ── LoRA ──────────────────────────────────────────────────────────────────
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  adapter_path: null                   # null=从头训练
  target_preset: language_safe

# ── 分布式（单卡最保守）──────────────────────────────────────────────────
graspoflow:
  tp_size: 1                           # 单卡
  dp_size: 1                           # 单卡
  pp_size: 1                           # 无流水线
  micro_batch_size: 1                  # 每个微批 1 个样本

# ── 训练超参 ──────────────────────────────────────────────────────────────
training:
  output_dir: ""                       # 空=自动生成 outputs/sft_<timestamp>
  seed: 42
  max_epochs: 20
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_accumulation_micro_batches: 4  # 攒 4 个微批做一次 optimizer step
  # 有效 batch/GPU = micro_batch_size × gradient_accumulation_micro_batches = 4
  lr_scheduler:
    type: cosine
    warmup_steps: 50
    min_lr_ratio: 0.0
    decay_steps: 1000
  save_steps: 100
  save_checkpoint_every_epoch: true

# ── 启动（单卡，nproc_per_node 自动推导 = 1）────────────────────────────
launch:

# ── Reward（SFT 忽略，为转 RL 预留）───────────────────────────────────────
reward:
  check_think: false
  check_json_markdown: true
  marker_reward_weight: 10.0
  content_reward_weight: 100.0
  numeric_tolerance: 0.2